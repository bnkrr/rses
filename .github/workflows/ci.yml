name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Check formatting
        run: |
          files="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Unit tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Cross-build macOS
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/rses-darwin-amd64 ./cmd/rses
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/rses-darwin-arm64 ./cmd/rses

      - name: Integration tests
        run: go test -tags=integration -timeout=2m ./integration/...
